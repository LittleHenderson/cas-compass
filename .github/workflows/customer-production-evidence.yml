name: Customer Production Evidence

on:
  workflow_dispatch:
    inputs:
      expected_master_head:
        description: Exact protected master HEAD deployed to public production
        required: true
        type: string
      expected_deploy_id:
        description: Exact public Render deployment ID (dep-...)
        required: true
        type: string
      expected_subject_sha256:
        description: Exact 64-char lowercase hex SHA-256 of the reviewed unsigned root-CI subject
        required: true
        type: string
      release_asset_id:
        description: Immutable numeric GitHub Release Asset ID of the uploaded unsigned subject
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: customer-production-evidence
  cancel-in-progress: false

jobs:
  verify_immutable_subject:
    name: verify-immutable-subject
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require protected exact-master dispatch and pinned subject inputs
        shell: bash
        env:
          DISPATCH_REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_MASTER_HEAD: ${{ inputs.expected_master_head }}
          EXPECTED_DEPLOY_ID: ${{ inputs.expected_deploy_id }}
          EXPECTED_SUBJECT_SHA256: ${{ inputs.expected_subject_sha256 }}
          RELEASE_ASSET_ID: ${{ inputs.release_asset_id }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REPOSITORY" = "LittleHenderson/cas-compass"
          test "$DEFAULT_BRANCH" = "master"
          test "$DISPATCH_REF" = "refs/heads/master"
          test "$DISPATCH_REF_PROTECTED" = "true"
          [[ "$EXPECTED_MASTER_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_SHA" = "$EXPECTED_MASTER_HEAD"
          [[ "$EXPECTED_DEPLOY_ID" =~ ^dep-[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_SUBJECT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_ASSET_ID" =~ ^[1-9][0-9]*$ ]]

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_master_head }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the isolated RS256 signing dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==49.0.0'

      - name: Run the fail-closed verifier and producer tests
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p 'test_verify_customer_production_acceptance.py'
          python -m unittest discover -s scripts/tests -p 'test_collect_root_ci_protected_deploy_facts.py'
          python -m unittest discover -s scripts/tests -p 'test_sign_root_ci_protected_deploy_receipt.py'
          python -m unittest discover -s scripts/tests -p 'test_security_release_evidence_integrity.py'

      - name: Download and verify the exact immutable release asset by ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SUBJECT_SHA256: ${{ inputs.expected_subject_sha256 }}
          RELEASE_ASSET_ID: ${{ inputs.release_asset_id }}
        run: |
          set -euo pipefail
          tag='customer-production-evidence'
          mkdir -p customer-production-evidence/subject

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          release_id="$(jq -er '.id' <<<"$release_json")"
          test "$(jq -er '.tag_name' <<<"$release_json")" = "$tag"

          asset_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RELEASE_ASSET_ID")"
          test "$(jq -er '.id' <<<"$asset_json")" = "$RELEASE_ASSET_ID"

          # Verify the immutable asset ID belongs to the exact expected release tag
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[].id' | grep -Fxq "$RELEASE_ASSET_ID"

          asset_size="$(jq -er '.size' <<<"$asset_json")"
          test "$asset_size" -gt 0
          test "$asset_size" -le 2000000

          jq -n \
            --arg release_tag "$tag" \
            --argjson release_id "$release_id" \
            --argjson asset "$asset_json" \
            '{
              release_tag: $release_tag,
              release_id: $release_id,
              id: $asset.id,
              name: $asset.name,
              url: $asset.url,
              updated_at: $asset.updated_at,
              size: $asset.size
            }' > customer-production-evidence/subject/release-asset-metadata.json

          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RELEASE_ASSET_ID" \
            -H "Accept: application/octet-stream" \
            > customer-production-evidence/subject/root-ci-protected-deploy.json

          test -s customer-production-evidence/subject/root-ci-protected-deploy.json
          downloaded_size="$(wc -c < customer-production-evidence/subject/root-ci-protected-deploy.json | tr -d ' ')"
          test "$downloaded_size" -eq "$asset_size"

          actual_subject_sha256="$(sha256sum customer-production-evidence/subject/root-ci-protected-deploy.json | cut -d ' ' -f 1)"
          test "$actual_subject_sha256" = "$EXPECTED_SUBJECT_SHA256"

          sha256sum customer-production-evidence/subject/root-ci-protected-deploy.json \
            > customer-production-evidence/subject/root-ci-protected-deploy.sha256

      - name: Upload verified immutable subject for protected signing
        uses: actions/upload-artifact@v7
        with:
          name: verified-root-ci-subject-${{ github.run_id }}
          path: |
            customer-production-evidence/subject/root-ci-protected-deploy.json
            customer-production-evidence/subject/root-ci-protected-deploy.sha256
            customer-production-evidence/subject/release-asset-metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Record pre-approval immutable subject digest
        shell: bash
        env:
          EXPECTED_MASTER_HEAD: ${{ inputs.expected_master_head }}
          EXPECTED_DEPLOY_ID: ${{ inputs.expected_deploy_id }}
          EXPECTED_SUBJECT_SHA256: ${{ inputs.expected_subject_sha256 }}
          RELEASE_ASSET_ID: ${{ inputs.release_asset_id }}
        run: |
          set -euo pipefail
          {
            echo '### Immutable root-CI subject verified before protected approval'
            echo "- Immutable release asset ID: \`$RELEASE_ASSET_ID\`"
            echo "- Verified subject SHA-256: \`$EXPECTED_SUBJECT_SHA256\`"
            echo "- Expected protected master HEAD: \`$EXPECTED_MASTER_HEAD\`"
            echo "- Expected deployment ID: \`$EXPECTED_DEPLOY_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

  root_ci_protected_deploy_receipt:
    name: collect-and-sign-root-ci-protected-deploy
    needs: verify_immutable_subject
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: customer-production
    steps:
      - name: Require protected exact-master dispatch and pinned subject inputs
        shell: bash
        env:
          DISPATCH_REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_MASTER_HEAD: ${{ inputs.expected_master_head }}
          EXPECTED_DEPLOY_ID: ${{ inputs.expected_deploy_id }}
          EXPECTED_SUBJECT_SHA256: ${{ inputs.expected_subject_sha256 }}
          RELEASE_ASSET_ID: ${{ inputs.release_asset_id }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REPOSITORY" = "LittleHenderson/cas-compass"
          test "$DEFAULT_BRANCH" = "master"
          test "$DISPATCH_REF" = "refs/heads/master"
          test "$DISPATCH_REF_PROTECTED" = "true"
          [[ "$EXPECTED_MASTER_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_SHA" = "$EXPECTED_MASTER_HEAD"
          [[ "$EXPECTED_DEPLOY_ID" =~ ^dep-[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_SUBJECT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_ASSET_ID" =~ ^[1-9][0-9]*$ ]]

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_master_head }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the isolated RS256 signing dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==49.0.0'

      - name: Run the fail-closed verifier and producer tests
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p 'test_verify_customer_production_acceptance.py'
          python -m unittest discover -s scripts/tests -p 'test_collect_root_ci_protected_deploy_facts.py'
          python -m unittest discover -s scripts/tests -p 'test_sign_root_ci_protected_deploy_receipt.py'
          python -m unittest discover -s scripts/tests -p 'test_security_release_evidence_integrity.py'

      - name: Download the verified immutable subject artifact
        uses: actions/download-artifact@v8
        with:
          name: verified-root-ci-subject-${{ github.run_id }}
          path: customer-production-evidence/subject

      - name: Re-verify exact subject SHA-256 and immutable asset metadata before signing
        shell: bash
        env:
          EXPECTED_SUBJECT_SHA256: ${{ inputs.expected_subject_sha256 }}
          RELEASE_ASSET_ID: ${{ inputs.release_asset_id }}
        run: |
          set -euo pipefail
          test -s customer-production-evidence/subject/root-ci-protected-deploy.json
          test -s customer-production-evidence/subject/root-ci-protected-deploy.sha256
          test -s customer-production-evidence/subject/release-asset-metadata.json

          actual_subject_sha256="$(sha256sum customer-production-evidence/subject/root-ci-protected-deploy.json | cut -d ' ' -f 1)"
          test "$actual_subject_sha256" = "$EXPECTED_SUBJECT_SHA256"
          recorded_subject_sha256="$(cut -d ' ' -f 1 customer-production-evidence/subject/root-ci-protected-deploy.sha256)"
          test "$recorded_subject_sha256" = "$EXPECTED_SUBJECT_SHA256"
          test "$(jq -er '.id' customer-production-evidence/subject/release-asset-metadata.json)" = "$RELEASE_ASSET_ID"
          test "$(jq -er '.release_tag' customer-production-evidence/subject/release-asset-metadata.json)" = "customer-production-evidence"

      - name: Sign the exact read-back subject with the pinned environment issuer
        env:
          CUSTOMER_PRODUCTION_SIGNING_KEY_PEM: ${{ secrets.CUSTOMER_PRODUCTION_SIGNING_KEY_PEM }}
          EXPECTED_MASTER_HEAD: ${{ inputs.expected_master_head }}
          EXPECTED_DEPLOY_ID: ${{ inputs.expected_deploy_id }}
          EXPECTED_SUBJECT_SHA256: ${{ inputs.expected_subject_sha256 }}
          RELEASE_ASSET_ID: ${{ inputs.release_asset_id }}
        run: |
          set -euo pipefail
          mkdir -p customer-production-evidence/receipts
          python scripts/sign_root_ci_protected_deploy_receipt.py \
            --payload customer-production-evidence/subject/root-ci-protected-deploy.json \
            --subject-file customer-production-evidence/subject/root-ci-protected-deploy.json \
            --expected-master-head "$EXPECTED_MASTER_HEAD" \
            --expected-deploy-id "$EXPECTED_DEPLOY_ID" \
            --expected-subject-sha256 "$EXPECTED_SUBJECT_SHA256" \
            --release-asset-id "$RELEASE_ASSET_ID" \
            --expiry-minutes 120 \
            --output customer-production-evidence/receipts/root-ci-protected-deploy.json

      - name: Record the external pin for the exact signed receipt bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum customer-production-evidence/receipts/root-ci-protected-deploy.json \
            > customer-production-evidence/receipts/root-ci-protected-deploy.sha256

      - name: Upload the partial receipt bundle
        uses: actions/upload-artifact@v7
        with:
          name: root-ci-protected-deploy-receipt-${{ github.run_id }}
          path: |
            customer-production-evidence/subject/root-ci-protected-deploy.sha256
            customer-production-evidence/subject/release-asset-metadata.json
            customer-production-evidence/receipts/root-ci-protected-deploy.json
            customer-production-evidence/receipts/root-ci-protected-deploy.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the OPEN claim boundary
        shell: bash
        env:
          EXPECTED_SUBJECT_SHA256: ${{ inputs.expected_subject_sha256 }}
          RELEASE_ASSET_ID: ${{ inputs.release_asset_id }}
        run: |
          set -euo pipefail
          receipt_sha256="$(cut -d ' ' -f 1 customer-production-evidence/receipts/root-ci-protected-deploy.sha256)"
          {
            echo '### Root CI protected deploy receipt created'
            echo '- The immutable release asset contains unsigned, sanitized source facts collected locally with admin-read access.'
            echo "- Immutable release asset ID: \`$RELEASE_ASSET_ID\`."
            echo "- Exact unsigned subject SHA-256 pin: \`$EXPECTED_SUBJECT_SHA256\`."
            echo '- The artifact contains one RS256 receipt for `root_ci_protected_deploy`.'
            echo '- The root-CI source uses the fresh-current-state/historical-release-provenance schema and the receipt TTL is exactly 120 minutes.'
            echo "- Exact signed-receipt SHA-256 pin: \`$receipt_sha256\`."
            echo '- The checked-in gate manifest remains `OPEN`.'
            echo '- This workflow never dispatches Customer Production ACCEPT.'
          } >> "$GITHUB_STEP_SUMMARY"
