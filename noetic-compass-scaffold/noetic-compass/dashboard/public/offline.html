<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050b0a" />
  <title>CAS Compass | CAS Lab — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050b0a;
      color: #eaf3ee;
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 24px;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #0c1513;
      border: 1px solid #eaf3ee;
      border-radius: 2px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
    }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #86958d;
      margin-bottom: 8px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ff7b72;
      border: 1px solid rgba(255, 123, 114, 0.35);
      background: rgba(255, 123, 114, 0.08);
      border-radius: 2px;
      padding: 4px 10px;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: #ff7b72;
      display: inline-block;
    }
    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #eaf3ee;
      margin-bottom: 12px;
    }
    p {
      color: #b3c2ba;
      font-size: 14px;
      max-width: 340px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    button {
      background: #37f5a0;
      color: #050b0a;
      border: 1px solid #37f5a0;
      padding: 12px 28px;
      border-radius: 2px;
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
    }
    button:hover { opacity: 0.9; }
    button:focus-visible { outline: 3px solid #37f5a0; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.svg" alt="CAS Compass" class="logo" />
    <div class="status">
      <span class="dot"></span>
      Offline
    </div>
    <p class="eyebrow">CAS Lab · Evaluation Workbench</p>
    <h1>CAS Compass</h1>
    <p>A network connection is required to reach the CAS Lab API. Check your connection and retry.</p>
    <button onclick="location.reload()">Retry Connection</button>
  </div>
</body>
</html>
